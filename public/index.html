<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart Management</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      color: #333;
    }

    /* ── Header ── */
    header {
      background: #2c3e50;
      color: white;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    header h1 {
      font-size: 1.4rem;
      letter-spacing: 1px;
    }

    nav button {
      background: none;
      border: none;
      color: #ecf0f1;
      font-size: 0.95rem;
      margin-left: 20px;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    nav button:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    nav button.active {
      background: #3498db;
      color: white;
    }

    /* ── Views ── */
    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 24px;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 70px 20px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    .hero h2 {
      font-size: 2.2rem;
      color: #2c3e50;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 32px;
    }

    .hero-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ── Buttons ── */
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn-primary {
      background: #3498db;
      color: white;
    }

    .btn-primary:hover {
      background: #2980b9;
      transform: translateY(-1px);
    }

    .btn-success {
      background: #27ae60;
      color: white;
    }

    .btn-success:hover {
      background: #219a52;
    }

    .btn-danger {
      background: #e74c3c;
      color: white;
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    .btn-danger:hover {
      background: #c0392b;
    }

    .btn-warning {
      background: #f39c12;
      color: white;
      padding: 8px 16px;
      font-size: 0.85rem;
    }

    .btn-warning:hover {
      background: #d68910;
    }

    /* ── Section heading ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .section-header h2 {
      font-size: 1.6rem;
      color: #2c3e50;
    }

    /* ── Cart Table ── */
    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
    }

    thead {
      background: #2c3e50;
      color: white;
    }

    th,
    td {
      padding: 14px 18px;
      text-align: left;
      font-size: 0.95rem;
    }

    tbody tr:nth-child(even) {
      background: #f8f9fa;
    }

    tbody tr:hover {
      background: #eaf4fb;
    }

    td .actions {
      display: flex;
      gap: 8px;
    }

    /* ── Add to Cart Form ── */
    .card {
      background: white;
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }

    .card h2 {
      margin-bottom: 24px;
      color: #2c3e50;
      font-size: 1.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #555;
    }

    .form-group input,
    .form-group select {
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #3498db;
    }

    /* ── Toast notification ── */
    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      padding: 14px 24px;
      border-radius: 10px;
      color: white;
      font-size: 0.95rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 999;
      max-width: 340px;
    }

    #toast.show {
      opacity: 1;
    }

    #toast.success {
      background: #27ae60;
    }

    #toast.error {
      background: #e74c3c;
    }

    /* ── Edit Modal ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }

    #modal-overlay.open {
      display: flex;
    }

    #modal {
      background: white;
      border-radius: 14px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    #modal h3 {
      margin-bottom: 20px;
      font-size: 1.3rem;
      color: #2c3e50;
    }

    .modal-form .form-group {
      margin-bottom: 14px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    .btn-secondary {
      background: #bdc3c7;
      color: #333;
    }

    .btn-secondary:hover {
      background: #a0a7ab;
    }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 1.1rem;
    }

    footer {
      text-align: center;
      padding: 24px;
      margin-top: 60px;
      color: #999;
      font-size: 0.85rem;
      border-top: 1px solid #e0e0e0;
    }
  </style>
</head>

<body>

  <!-- ── Header ── -->
  <header>
    <h1>🛒 Shopping Cart</h1>
    <nav>
      <button id="nav-home" class="active" onclick="showView('home')">Home</button>
      <button id="nav-products" onclick="showView('products')">View Cart</button>
      <button id="nav-add" onclick="showView('add')">Add Item</button>
    </nav>
  </header>

  <main>

    <!-- ── View: Home ── -->
    <div id="view-home" class="view active">
      <section class="hero">
        <h2>Welcome to the Shopping Cart App</h2>
        <p>Browse products, manage your cart, and check out with ease.</p>
        <div class="hero-actions">
          <button class="btn btn-primary" onclick="showView('products')">📦 View Cart</button>
          <button class="btn btn-success" onclick="showView('add')">➕ Add New Item</button>
        </div>
      </section>
    </div>

    <!-- ── View: Cart / Products ── -->
    <div id="view-products" class="view">
      <div class="section-header">
        <h2>🛍️ Cart Items</h2>
        <button class="btn btn-primary" onclick="loadCart()">🔄 Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Product Name</th>
              <th>Price (₹)</th>
              <th>Qty</th>
              <th>Category</th>
              <th>Total</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="cart-body">
            <tr>
              <td colspan="7" class="empty-state">Loading...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- ── View: Add Item ── -->
    <div id="view-add" class="view">
      <div class="card">
        <h2>➕ Add Item to Cart</h2>
        <div class="form-grid">
          <div class="form-group">
            <label for="add-name">Product Name</label>
            <input id="add-name" type="text" placeholder="e.g. Wireless Mouse" />
          </div>
          <div class="form-group">
            <label for="add-category">Category</label>
            <input id="add-category" type="text" placeholder="e.g. Electronics" />
          </div>
          <div class="form-group">
            <label for="add-price">Price (₹)</label>
            <input id="add-price" type="number" min="0.01" step="0.01" placeholder="25.99" />
          </div>
          <div class="form-group">
            <label for="add-qty">Quantity</label>
            <input id="add-qty" type="number" min="1" step="1" placeholder="1" />
          </div>
        </div>
        <button class="btn btn-success" onclick="addItem()">✅ Add to Cart</button>
      </div>
    </div>

  </main>

  <footer>
    <p>&copy; 2026 Shopping Cart Management App. All rights reserved.</p>
  </footer>

  <!-- ── Edit Modal ── -->
  <div id="modal-overlay">
    <div id="modal">
      <h3>✏️ Edit Item</h3>
      <input type="hidden" id="edit-id" />
      <div class="modal-form">
        <div class="form-group"><label>Product Name</label><input id="edit-name" type="text" /></div>
        <div class="form-group"><label>Category</label><input id="edit-category" type="text" /></div>
        <div class="form-group"><label>Price (₹)</label><input id="edit-price" type="number" step="0.01" /></div>
        <div class="form-group"><label>Quantity</label><input id="edit-qty" type="number" step="1" /></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEdit()">💾 Save Changes</button>
      </div>
    </div>
  </div>

  <!-- ── Toast ── -->
  <div id="toast"></div>

  <script>
    const API = 'http://localhost:4000';

    // ── View switching ──────────────────────────────────────────────────────
    function showView(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('view-' + name).classList.add('active');
      document.getElementById('nav-' + name).classList.add('active');
      if (name === 'products') loadCart();
    }

    // ── Toast ───────────────────────────────────────────────────────────────
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `show ${type}`;
      setTimeout(() => { t.className = ''; }, 3000);
    }

    // ── Load all cart items ─────────────────────────────────────────────────
    async function loadCart() {
      const tbody = document.getElementById('cart-body');
      tbody.innerHTML = '<tr><td colspan="7" class="empty-state">Loading...</td></tr>';
      try {
        const res = await fetch(`${API}/cart`);
        const data = await res.json();
        if (!data.cart || data.cart.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state">🛒 Your cart is empty.</td></tr>';
          return;
        }
        tbody.innerHTML = data.cart.map(item => `
          <tr>
            <td>${item.id}</td>
            <td>${item.productName}</td>
            <td>₹${item.price.toFixed(2)}</td>
            <td>${item.quantity}</td>
            <td>${item.category}</td>
            <td>₹${(item.price * item.quantity).toFixed(2)}</td>
            <td>
              <div class="actions">
                <button class="btn btn-warning" onclick="openEdit(${item.id})">✏️ Edit</button>
                <button class="btn btn-danger"  onclick="deleteItem(${item.id})">🗑️ Delete</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">❌ Could not connect to server. Is it running on port 4000?</td></tr>';
      }
    }

    // ── Add item ────────────────────────────────────────────────────────────
    async function addItem() {
      const productName = document.getElementById('add-name').value.trim();
      const category = document.getElementById('add-category').value.trim();
      const price = parseFloat(document.getElementById('add-price').value);
      const quantity = parseInt(document.getElementById('add-qty').value);

      if (!productName || !category || isNaN(price) || isNaN(quantity)) {
        showToast('⚠️ Please fill in all fields correctly.', 'error'); return;
      }

      try {
        const res = await fetch(`${API}/cart`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productName, price, quantity, category })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`✅ ${data.message}`);
          document.getElementById('add-name').value = '';
          document.getElementById('add-category').value = '';
          document.getElementById('add-price').value = '';
          document.getElementById('add-qty').value = '';
        } else {
          showToast(`❌ ${data.error}`, 'error');
        }
      } catch {
        showToast('❌ Server error. Is it running on port 4000?', 'error');
      }
    }

    // ── Delete item ─────────────────────────────────────────────────────────
    async function deleteItem(id) {
      if (!confirm(`Delete item #${id}?`)) return;
      try {
        const res = await fetch(`${API}/cart/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) { showToast(`🗑️ ${data.message}`); loadCart(); }
        else { showToast(`❌ ${data.error}`, 'error'); }
      } catch {
        showToast('❌ Server error.', 'error');
      }
    }

    // ── Open edit modal ─────────────────────────────────────────────────────
    async function openEdit(id) {
      try {
        const res = await fetch(`${API}/cart/${id}`);
        const data = await res.json();
        if (!data.success) { showToast(`❌ ${data.error}`, 'error'); return; }
        const item = data.item;
        document.getElementById('edit-id').value = item.id;
        document.getElementById('edit-name').value = item.productName;
        document.getElementById('edit-category').value = item.category;
        document.getElementById('edit-price').value = item.price;
        document.getElementById('edit-qty').value = item.quantity;
        document.getElementById('modal-overlay').classList.add('open');
      } catch {
        showToast('❌ Could not load item.', 'error');
      }
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('open');
    }

    // ── Save edited item ────────────────────────────────────────────────────
    async function saveEdit() {
      const id = document.getElementById('edit-id').value;
      const productName = document.getElementById('edit-name').value.trim();
      const category = document.getElementById('edit-category').value.trim();
      const price = parseFloat(document.getElementById('edit-price').value);
      const quantity = parseInt(document.getElementById('edit-qty').value);

      if (!productName || !category || isNaN(price) || isNaN(quantity)) {
        showToast('⚠️ All fields are required.', 'error'); return;
      }

      try {
        const res = await fetch(`${API}/cart/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productName, price, quantity, category })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`✅ ${data.message}`);
          closeModal();
          loadCart();
        } else {
          showToast(`❌ ${data.error}`, 'error');
        }
      } catch {
        showToast('❌ Server error.', 'error');
      }
    }

    // Close modal when clicking outside it
    document.getElementById('modal-overlay').addEventListener('click', function (e) {
      if (e.target === this) closeModal();
    });
  </script>

</body>

</html>
